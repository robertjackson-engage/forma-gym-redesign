<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><title>Cards</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060709; --ink-2:#0d0f13; --ink-3:#15181e;
  --white:#ffffff; --bone:#f4f7f6;
  --brand:#08d6dd; --accent:#08d6dd; --accent-soft:#6ef0f4; --accent-ink:#067e83;
  --ember:#fb8e28;
  --line:rgba(244,247,246,.14); --muted:rgba(244,247,246,.62);
  --font-display:"Anton","Arial Narrow",sans-serif;
  --font-body:"Montserrat","Helvetica Neue",sans-serif; /* stand-in for Proxima Nova */
  --radius:0px; --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--bone);font:400 15px/1.6 var(--font-body);padding:28px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--font-display);text-transform:uppercase;font-weight:400;line-height:1.02;letter-spacing:.01em}
.serif{color:var(--accent)} /* accent = COLOR ONLY, same typeface — kit v1.2 */
.label{font-family:var(--font-body);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-weight:600}
.label:first-of-type{margin-top:0}
.btn{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-body);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding:16px 30px;border:1px solid var(--bone);color:var(--bone);cursor:pointer;background:none;transition:.3s}
.btn--solid{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.btn--sm{padding:12px 22px}
.btn:hover{border-color:var(--accent);color:var(--accent-soft)}
.btn--solid:hover{filter:brightness(1.1);color:var(--ink)}
</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(2,240px);gap:16px">
  <a href="#" style="text-decoration:none;color:inherit;display:block">
    <div style="position:relative;aspect-ratio:4/4.6;background:linear-gradient(160deg,#0e3a3e 0%,#062024 60%,#04181c 100%);overflow:hidden">
      <span style="position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.2em;color:var(--muted)">05</span>
      <div style="position:absolute;left:14px;right:14px;bottom:12px">
        <h3 style="font-size:26px">Aqua</h3>
        <span style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft)">Explore &rarr;</span>
      </div>
    </div>
  </a>
  <div style="border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:10px;background:var(--ink-2)">
    <h3 style="font-size:20px">Single Club</h3>
    <div style="font-family:var(--font-display);font-size:40px;color:var(--accent)">$XX<span style="font-size:14px;color:var(--muted);font-family:var(--font-body)">/mo</span></div>
    <p style="font-size:12.5px;color:var(--muted);flex:1">Full access to your home club, group fitness included.</p>
    <button class="btn btn--sm" style="justify-content:center">Get Started</button>
  </div>
</div>
<p style="font-size:12px;color:var(--muted);margin-top:20px">Image cards: number chip top-left, label bottom, hover zoom. Wide banner assets MUST set .obj-l/.obj-r subject positioning (kit §5). Mobile card frame is 4/3.2.</p>
</body></html>
