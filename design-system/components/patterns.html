<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><title>Accordion & rows</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060709; --ink-2:#0d0f13; --ink-3:#15181e;
  --white:#ffffff; --bone:#f4f7f6;
  --brand:#08d6dd; --accent:#08d6dd; --accent-soft:#6ef0f4; --accent-ink:#067e83;
  --ember:#fb8e28;
  --line:rgba(244,247,246,.14); --muted:rgba(244,247,246,.62);
  --font-display:"Anton","Arial Narrow",sans-serif;
  --font-body:"Montserrat","Helvetica Neue",sans-serif; /* stand-in for Proxima Nova */
  --radius:0px; --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--bone);font:400 15px/1.6 var(--font-body);padding:28px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--font-display);text-transform:uppercase;font-weight:400;line-height:1.02;letter-spacing:.01em}
.serif{color:var(--accent)} /* accent = COLOR ONLY, same typeface — kit v1.2 */
.label{font-family:var(--font-body);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-weight:600}
.label:first-of-type{margin-top:0}
.btn{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-body);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding:16px 30px;border:1px solid var(--bone);color:var(--bone);cursor:pointer;background:none;transition:.3s}
.btn--solid{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.btn--sm{padding:12px 22px}
.btn:hover{border-color:var(--accent);color:var(--accent-soft)}
.btn--solid:hover{filter:brightness(1.1);color:var(--ink)}
</style>
</head><body>
<div class="label">Accordion</div>
<div style="border-top:1px solid var(--line)">
  <div style="border-bottom:1px solid var(--line);padding:18px 4px;display:flex;justify-content:space-between;align-items:center">
    <h3 style="font-size:18px">What's included in my membership?</h3><span style="color:var(--accent);font-size:20px">–</span>
  </div>
  <p style="padding:0 4px 18px;color:var(--muted);font-size:13.5px;max-width:60ch">Group fitness, pools, sauna &amp; steam, Kidzville childcare and both clubs on the two-club plan.</p>
  <div style="border-bottom:1px solid var(--line);padding:18px 4px;display:flex;justify-content:space-between;align-items:center">
    <h3 style="font-size:18px;color:var(--muted)">Do you offer day passes?</h3><span style="color:var(--accent);font-size:20px">+</span>
  </div>
</div>
<div class="label">Numbered rows</div>
<div style="display:grid;grid-template-columns:44px 180px 1fr;gap:14px;border-bottom:1px solid var(--line);padding:16px 0;align-items:baseline">
  <span style="color:var(--accent);font-size:12px;letter-spacing:.14em">01</span>
  <b style="font-family:var(--font-display);text-transform:uppercase;font-weight:400;font-size:17px">Heated pools</b>
  <span style="color:var(--muted);font-size:13px">Outdoor lap pool under the redwoods; 6-lane junior olympic pool in San Jose.</span>
</div>
</body></html>
